# Settings that don't belong to any single series.
# Every other *.yaml in this directory is one series, keyed by its filename.
# uid_domain is NOT set here -- it's the required UID_DOMAIN environment variable.

retention:
  historical_days: 180
  cancelled_after_event_days: 90

defaults:
  # Fallback session lengths, used when a session has no `duration:` of its own
  # and its series has no override. Keys are session types.
  durations:
    practice: "1h"
    warmup: "20m"
    qualifying: "1h"
    sprint: "45m"
  # Fallback alarms per session type. A session's own `alarms:` always wins,
  # including an explicit empty list.
  alerts:
    race: ["-1d", "-30m"]
    qualifying: ["-15m"]
    hyperpole: ["-15m"]
    sprint: ["-15m"]
    sprint_qualifying: ["-15m"]
    warmup: []
    practice: []

unknown_time:
  # Appended to the title of a session marked `tbc: true` -- the official
  # timetable has the date but hasn't announced a time yet.
  summary_suffix: " (time TBC)"
