name: Formula 1
# Where this series' timetable is kept in step with. The scheduled agent reads it;
# nothing in the app fetches anything.
schedule_url: https://www.formula1.com/en/racing/2026

# Comments in a series file survive: nothing but you and the agent writes it.
events:
- name: Pre-season testing
  location: Bahrain International Circuit
  sessions:
  # All-day and deliberately so -- a test day has no single start time. Not `tbc`.
  - uid: f1-2026-preseason-test
    type: testing
    date: '2026-02-11'
    note: dates announced, times TBA

- name: Australian Grand Prix
  location: Melbourne Grand Prix Circuit, Australia
  round: 1
  sessions:
  - uid: f1-2026-australia-practice-1
    label: Practice 1
    type: practice
    start: '2026-03-06T01:30:00+00:00'
  - uid: f1-2026-australia-qualifying
    label: Qualifying
    type: qualifying
    start: '2026-03-07T05:00:00+00:00'
  # No label: the session is published as just the event name, which is how a
  # race reads best.
  - uid: f1-2026-australia-race
    type: race
    start: '2026-03-08T04:00:00+00:00'
    duration: 2h
