name: Publish

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

# A newer commit's run cancels an older commit's run outright, so a slow build
# for commit A can never finish (and publish) after a faster commit B already
# has -- closing the gap the `check` job's own point-in-time freshness check
# can't, since that only proves freshness before the build, not after it.
concurrency:
  group: publish-latest
  cancel-in-progress: true

jobs:
  # CI for two commits pushed close together can finish out of order. Without
  # this, the slower CI run would publish its (older) commit as `latest` after
  # the faster run already published the newer one, rolling production back.
  check:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    outputs:
      fresh: ${{ steps.freshness.outputs.fresh }}
    steps:
      - name: Confirm this is still the newest commit on main
        id: freshness
        run: |
          set -euo pipefail
          current="$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)"
          if [ -z "$current" ]; then
            echo "::error::git ls-remote returned no SHA for main -- can't confirm freshness" >&2
            exit 1
          fi
          if [ "$current" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check
    if: needs.check.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
