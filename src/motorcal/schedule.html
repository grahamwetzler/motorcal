<body>
<div class="wrap">

      1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
      -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04
      2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54
      1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>

  <header>
    <h1>Motor<b>cal</b></h1>
    <p>Every session of every race weekend, in your own time zone.</p>
    <p class="nav"><a href="/">← Build a calendar to subscribe to</a></p>
  </header>

  <section class="filters">
    <h2>Series</h2>
    <p class="hint">Untick a series to hide it.</p>
    <div class="chips" id="series"></div>
  </section>

  <div id="schedule"></div>

  <footer class="site-footer">
    <p>© 2026 Graham Wetzler</p>
    <p>Schedule data is compiled from third-party official timetables and remains subject to the source&rsquo;s terms.</p>
  </footer>
</div>

<script>
// The full season, fetched from /sessions.json rather than inlined: the same
// data this page draws is then readable on its own.
// The label a session falls back to when the data gives it none -- a race is
// just the event name in the feed, but it still needs a name in a list of
// sessions. Must list every SessionType -- tests/test_web_index.py asserts it.
const TYPES = [
  ["practice", "Practice"],
  ["warmup", "Warm-up"],
  ["qualifying", "Qualifying"],
  ["hyperpole", "Hyperpole"],
  ["sprint_qualifying", "Sprint qualifying"],
  ["sprint", "Sprint"],
  ["race", "Race"],
  ["testing", "Testing"],
];
const LABELS = Object.fromEntries(TYPES);

// Same helper, and the same rule, as index.html: everything goes in through
// textContent, because event and series names come from the data directory.
function make(tag, props = {}, ...kids) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...kids);
  return node;
}

// --- time ------------------------------------------------------------------
// An all-day session has no time, so it sits at local midnight of its day --
// the day is the only thing that was announced, and showing it shifted into
// another date by a UTC offset would be wrong.
function starts(session) {
  return new Date(session.start || session.date + "T00:00:00");
}
// When a session is over. An all-day one runs out its whole day, which is what
// keeps a test day from greying out at midnight UTC.
function ends(session) {
  if (!session.start) return new Date(starts(session).getTime() + 86400000);
  return new Date(starts(session).getTime() + (session.duration || 0) * 1000);
}
function isPast(event, now) {
  return event.sessions.every((session) => ends(session) <= now);
}

const time = (date) => date.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
const day = (date) => date.toLocaleDateString([], {weekday: "short", day: "numeric", month: "short"});

// The day heading carries the date, so a session only has to say the clock
// time -- unless it runs past midnight, where the end needs its own weekday or
// Le Mans reads "9:00 AM - 9:00 AM". A session is filed under the day it starts,
// so only the end can land on another day.
const weekday = (date) => date.toLocaleDateString([], {weekday: "short"});

function timeText(session) {
  if (!session.start) return "Time TBC";
  const start = starts(session);
  if (!session.duration) return time(start);
  const end = ends(session);
  const over = end.toDateString() !== start.toDateString() ? ` ${weekday(end)}` : "";
  return `${time(start)} – ${time(end)}${over}`;
}

// --- days ------------------------------------------------------------------
// A weekend runs over several days, and reading it a day at a time is how a
// timetable is published. Sessions arrive in running order, so a day is a run
// of neighbours -- no sorting or bucketing needed.
function daysOf(event) {
  const days = [];
  for (const session of event.sessions) {
    const date = starts(session);
    const key = date.toDateString();
    const last = days[days.length - 1];
    if (last && last.key === key) last.sessions.push(session);
    else days.push({key, date, sessions: [session]});
  }
  return days;
}

// The zone belongs on the day rather than on every session: one label instead
// of one per row. Taken from the day's first session that has a time, since an
// all-day one has no offset to read it from.
function zoneOf(sessions) {
  const timed = sessions.find((session) => session.start);
  if (!timed) return "";
  return new Intl.DateTimeFormat([], {timeZoneName: "short"})
    .formatToParts(starts(timed)).find((part) => part.type === "timeZoneName").value;
}

// --- rendering -------------------------------------------------------------
let DATA = {series: [], events: []};
let NAMES = {};
let COLOR = {};

function weekendCard(event) {
  const card = make("div", {className: "weekend"});
  card.style.setProperty("--c", COLOR[event.series]);

  const round = event.round === null ? "" : ` · Round ${event.round}`;
  card.append(make("div", {className: "series", textContent: NAMES[event.series] + round}));

  const name = make("div", {className: "title"});
  // Linked when the data has an official event page, plain text otherwise. It
  // leaves the site, and this is a list to browse, so it opens alongside.
  name.append(event.url
    ? make("a", {href: event.url, textContent: event.name,
        target: "_blank", rel: "noopener"})
    : event.name);
  card.append(name);
  if (event.location) card.append(make("div", {className: "where", textContent: event.location}));

  for (const {date, sessions} of daysOf(event)) {
    const zone = zoneOf(sessions);
    card.append(make("div", {className: "date", textContent: day(date) + (zone ? ` · ${zone}` : "")}));
    const list = make("dl", {className: "sessions"});
    for (const session of sessions) {
      list.append(
        make("dt", {textContent: session.label || LABELS[session.type]}),
        make("dd", {textContent: timeText(session)}),
      );
    }
    card.append(list);
  }
  return card;
}

function monthOf(event) {
  return starts(event.sessions[0]).toLocaleDateString([], {month: "long", year: "numeric"});
}

// Weekends under a month heading each time the month changes.
function appendMonths(box, events) {
  let month = null;
  for (const event of events) {
    const heading = monthOf(event);
    if (heading !== month) {
      month = heading;
      box.append(make("div", {className: "month", textContent: heading}));
    }
    box.append(weekendCard(event));
  }
}

function render() {
  const box = document.getElementById("schedule");
  box.textContent = "";
  const series = new Set(DATA.series.filter((s) => seriesBoxes[s.key].querySelector("input").checked)
    .map((s) => s.key));

  if (!series.size) {
    box.append(make("div", {className: "event none", textContent: "Pick at least one series."}));
    return;
  }

  const now = new Date();
  const events = DATA.events.filter((event) => series.has(event.series));
  const past = events.filter((event) => isPast(event, now));
  const upcoming = events.filter((event) => !isPast(event, now));

  // What has already run is folded away rather than dropped: the season is
  // still the season, but nobody opening this page is looking for last month.
  // Closed, so what is next sits at the top of the page without a scroll.
  if (past.length) {
    const body = make("div", {className: "details-body"});
    appendMonths(body, past);
    box.append(make("details", {className: "past"},
      make("summary", {}, `${past.length} weekend${past.length === 1 ? "" : "s"} already run`),
      body));
  }
  appendMonths(box, upcoming);
  if (!upcoming.length) {
    box.append(make("div", {className: "event none",
      textContent: "Nothing left this season for these series."}));
  }
}

// --- controls --------------------------------------------------------------
const seriesBoxes = {};

function buildControls() {
  for (const {key, name} of DATA.series) {
    const box = make("input", {type: "checkbox", checked: true});
    box.addEventListener("change", render);
    seriesBoxes[key] = make("label", {className: "chip"}, box, name);
    seriesBoxes[key].style.setProperty("--c", COLOR[key]);
    document.getElementById("series").append(seriesBoxes[key]);
  }
}

fetch("/sessions.json").then((response) => {
  if (!response.ok) throw new Error(`/sessions.json returned ${response.status}`);
  return response.json();
}).then((data) => {
  DATA = data;
  NAMES = Object.fromEntries(DATA.series.map((s) => [s.key, s.name]));
  // One color per series, fixed order -- the same --series-1.. palette and the
  // same assignment index.html uses, so a series is one color across both pages.
  COLOR = Object.fromEntries(DATA.series.map((s, i) => [s.key, `var(--series-${i % 8 + 1})`]));
  buildControls();
  render();
}).catch((error) => {
  console.error(error);
  document.getElementById("schedule").append(make("div", {className: "event none",
    textContent: "Couldn't load the schedule. Try reloading the page."}));
});

// --- self-check ------------------------------------------------------------
// Grouping a weekend into days and the past/upcoming split are the only real
// logic here; this fails loudly in the console if either starts lying.
(function selfCheck() {
  const session = (over) => ({label: "", type: "race", start: null, date: null,
    tbc: false, round: null, duration: 3600, ...over});
  // Two sessions on one local day, then the race on the next.
  const noon = new Date("2026-03-01T12:00:00").toISOString();
  const later = new Date("2026-03-01T15:00:00").toISOString();
  const race = session({start: new Date("2026-03-02T12:00:00").toISOString()});
  const events = [
    {series: "a", name: "A", round: 1, location: null, url: null, sessions: [
      session({type: "practice", start: noon}),
      session({type: "qualifying", start: later}),
      race,
    ]},
    {series: "b", name: "B", round: null, location: null, url: null, sessions: [
      session({type: "testing", start: null, date: "2026-02-01", duration: null}),
    ]},
  ];
  const testing = events[1].sessions[0];
  let ok = true;
  const check = (got, want, what) => {
    if (JSON.stringify(got) !== JSON.stringify(want)) {
      ok = false; console.error(`self-check: ${what}\n  got  ${JSON.stringify(got)}\n  want ${JSON.stringify(want)}`);
    }
  };

  // Sessions arrive in running order, so a day is a run of neighbours.
  check(daysOf(events[0]).map((d) => d.sessions.length), [2, 1],
    "sessions group into the day they run on");
  check(daysOf(events[1]).length, 1, "an all-day session is a day of its own");
  check(timeText(testing), "Time TBC", "a session with no time says so");

  // A session that runs past midnight is still filed under the day it starts,
  // so the end is the only half that can need a weekday of its own.
  const overnight = session({start: new Date("2026-03-01T14:00:00").toISOString(),
    duration: 24 * 3600});
  check(daysOf({sessions: [overnight]}).length, 1, "a 24-hour race is one day, not two");
  check(timeText(overnight).endsWith(` ${weekday(ends(overnight))}`), true,
    "an end on another day names that day");
  const sameDay = events[0].sessions[0];
  check(timeText(sameDay), `${time(starts(sameDay))} – ${time(ends(sameDay))}`,
    "a session finishing the same day says only the clock times");
  check(zoneOf(events[1].sessions), "", "a day of all-day sessions has no zone to show");
  check(zoneOf(events[0].sessions) !== "", true, "a day with a time shows its zone");

  // A weekend is past only once its last session has finished, and an all-day
  // session runs out its whole day rather than ending at midnight.
  const green = starts(race).getTime();
  check(isPast(events[0], new Date(green + 30 * 60000)), false, "mid-race is not past");
  check(isPast(events[0], new Date(green + 90 * 60000)), true, "after the last session is past");
  // Relative to the session's own local midnight -- an all-day session has no
  // offset of its own, so a fixed UTC instant here would only pass in one zone.
  const midnight = starts(testing).getTime();
  check(isPast(events[1], new Date(midnight + 23 * 3600000)), false, "an all-day session lasts its day");
  check(isPast(events[1], new Date(midnight + 25 * 3600000)), true, "and is past the day after");

  console.log(ok ? "self-check ok" : "self-check FAILED");
})();
</script>
</body>
</html>
