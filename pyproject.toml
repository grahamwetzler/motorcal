[project]
name = "motorcal"
version = "0.1.0"
description = "Motorsports ICS calendar publisher"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "icalendar>=6.0",
    "apscheduler>=3.10",
]

[project.scripts]
motorcal = "motorcal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Not used by the app -- only by the TestClient and scripts/view_ics.py.
    "httpx>=0.27",
    "pre-commit>=4.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motorcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.format]
preview = true
