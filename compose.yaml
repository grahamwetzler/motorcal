services:
  app:
    image: ghcr.io/grahamwetzler/motorcal:latest
    restart: unless-stopped
    environment:
      UID_DOMAIN: "${UID_DOMAIN:?UID_DOMAIN must be set}"
    volumes:
      # data/ is baked into the image (see Dockerfile). state.yaml lives in its
      # own writable directory because it is replaced atomically, which a
      # single-file bind mount does not survive.
      - ./state:/state
    container_name: app
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set}"
    labels:
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      - app

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    command: --label-enable --cleanup --interval 1800
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
