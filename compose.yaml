services:
  app:
    image: ghcr.io/grahamwetzler/motorcal:latest
    restart: unless-stopped
    environment:
      UID_DOMAIN: "${UID_DOMAIN:?UID_DOMAIN must be set}"
      # Optional -- defaults to UID_DOMAIN when unset.
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:-}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Docker initializes this named volume from the image's UID 1000-owned
      # /state directory. state.yaml is replaced atomically on every save.
      - state:/state
    container_name: app
    labels:
      - com.centurylinklabs.watchtower.enable=true
    logging:
      # The access log fires on every request, cache hits included -- cap it
      # rather than trust the host's Docker daemon default (often unbounded).
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    command: --label-enable --cleanup --interval 1800
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  state:
