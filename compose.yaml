services:
  app:
    image: ghcr.io/grahamwetzler/motorcal:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      THESPORTSDB_API_KEY: "${THESPORTSDB_API_KEY:?THESPORTSDB_API_KEY must be set}"
      UID_DOMAIN: "${UID_DOMAIN:?UID_DOMAIN must be set}"
    volumes:
      - ./data:/data
    container_name: app
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set}"
    labels:
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      - app

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    command: --label-enable --cleanup --interval 1800
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
